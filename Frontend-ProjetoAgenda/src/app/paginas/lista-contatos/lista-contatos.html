<app-container>
  <app-cabecalho></app-cabecalho>
  <input type="search" placeholder="Digite para buscar" [(ngModel)]="filtroPorTexto">

  <section class="adicionar-contato">
    <button routerLink="/formulario">
      <img src="plus.png" alt="">
      <span>Adicionar Contato</span>
    </button>
  </section>

  @for (letra of alfabetoFiltrado; track letra) {
    <app-separador>
      {{ letra }}
      @for (
        contato of filtrarContatosPorLetraInicial(letra);
        track contato.id
      ) {
        <app-contato
          [id]="contato.id"
          [nome]="contato.nome"
          [telefone]="contato.telefone"
          [avatar]="contato.avatar"
        ></app-contato>
      }
    </app-separador>
  }
</app-container>
