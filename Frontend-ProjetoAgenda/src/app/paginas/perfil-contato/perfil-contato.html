<app-container>
  <header>
    <section class="cabecalho-link">
      <img src="/logo.png" alt="">
      <div>
        <button>
          <img class="seta" src="/arrow-left.png" alt="">
          <a routerLink="/lista-contatos">Voltar</a>
        </button>
      </div>
    </section>
    <section class="cabecalho-contato">
      <img src="/perfil-contato.png" alt="">
      <h1>Perfil do contato</h1>
    </section>
  </header>
  <section class="perfil">
    @if(contato.avatar) {
    <div class="imagem-perfil">
      <img [src]="contato.avatar" alt="Avatar do contato">
      <h2>{{ contato.nome }}</h2>
    </div>
    }
    <ul>
      <li>
        <i class="material-icons">call</i>
        <strong>Telefone</strong>
      </li>
      <li>{{ contato.telefone }}</li>
      <li>
        <i class="material-icons">mail</i>
        <strong>Email</strong>
      </li>
      <li>{{ contato.email }}</li>
      <li>
        <i class="material-icons">event</i>
        <strong>Data de nascimento</strong>
      </li>
      <li>{{ contato.aniversario }}</li>
      <li>
        <i class="material-icons">public</i>
        <strong>Redes sociais</strong>
      </li>
      <li>{{ contato.redes }}</li>
    </ul>
    <div class="botoes">
      <button class="botao-excluir" (click)="excluir()">
        Excluir contato
      </button>
      <button class="botao-editar" (click)="editar()">
        Editar
      </button>
    </div>
  </section>
</app-container>
